apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mmpro-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<USERNAME>/mmPro-middleware.git 
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true